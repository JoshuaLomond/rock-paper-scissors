<div class="game-container">
  <h1>{{ title() }}</h1>

  @if (!gameResult()) {
  <div class="choices">
    <button class="choice-button" (click)="play('rock')">
      <span class="emoji">🪨</span>
      <span>Rock</span>
    </button>
    <button class="choice-button" (click)="play('paper')">
      <span class="emoji">📄</span>
      <span>Paper</span>
    </button>
    <button class="choice-button" (click)="play('scissors')">
      <span class="emoji">✂️</span>
      <span>Scissors</span>
    </button>
  </div>
  } @else {
  <div class="result">
    <div
      class="result-message"
      [class.win]="gameResult()!.result === 'win'"
      [class.lose]="gameResult()!.result === 'lose'"
      [class.draw]="gameResult()!.result === 'draw'"
    >
      @if (gameResult()!.result === 'win') {
      <h2>You Win! 🎉</h2>
      } @else if (gameResult()!.result === 'lose') {
      <h2>You Lose! 😢</h2>
      } @else {
      <h2>It's a Draw! 🤝</h2>
      }
    </div>

    <div class="picks">
      <div class="pick">
        <p class="pick-label">You picked:</p>
        <p class="pick-value">{{ gameResult()!.userChoice }}</p>
      </div>
      <div class="pick">
        <p class="pick-label">Computer picked:</p>
        <p class="pick-value">{{ gameResult()!.computerChoice }}</p>
      </div>
    </div>

    <button class="play-again-button" (click)="reset()">Play Again</button>
  </div>
  }
</div>
